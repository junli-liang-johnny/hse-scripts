[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hse-scripts"
version = "0.1.0"
description = "HSE Data Pipeline Scripts for converting CSV to RDF"
authors = [
    {name = "HSE Data Pipeline Team"},
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rml-py @ git+https://github.com/junli-liang-johnny/rml-py.git"
]

[project.urls]
"Homepage" = "https://github.com/hse-ucd/hse-scripts"
"Bug Reports" = "https://github.com/hse-ucd/hse-scripts/issues"
"Source" = "https://github.com/hse-ucd/hse-scripts"

[project.scripts]
hse-data-join = "scripts:data_join"
hse-add-columns = "scripts:add_columns"
hse-re-order = "scripts:re_order"
hse-add-subheaders = "scripts:add_subheaders"
csv-rdf-convert = "scripts.rdf_mapping.csv_rdf_convert:main"
create-csv = "scripts.rdf_mapping.create_csv:main"
create-subject-csv = "scripts.rdf_mapping.create_subject_csv:main"
map2rdf = "scripts.rdf_mapping.map_to_rdf:main"
delphi-populate = "scripts.delphi.populate_metadata:main"
run-query = "sparql.run_query:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "sparql*"]
exclude = ["tests*", "__pycache__*"]
